<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#4a3b52;--u:1vh;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@supports(height:1dvh){:root{--u:1dvh}}
@media (orientation:landscape){:root{--u:max(min(1vh,.75vw),4.8px)}}
@supports(height:1dvh){@media (orientation:landscape){:root{--u:max(min(1dvh,.75vw),4.8px)}}}
@media (orientation:portrait){:root{--u:1vw}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:"Yuanti TC","Hiragino Maru Gothic ProN","jf-openhuninn-2.0","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 background:radial-gradient(ellipse at 50% 42%,#cdf04f 0%,#a9de2c 52%,#8fc720 100%)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 18%,transparent 19%);background-size:5vh 5vh;pointer-events:none}
#map{position:fixed;inset:0;width:100%;height:100%;display:block}
#map text{font-family:inherit}
.hud{position:fixed;z-index:5}

/* ---- SVG 場景 ---- */
.tok{transition:transform .22s linear}
.hopper{transform-box:fill-box;transform-origin:50% 100%}
.tok.me .hopper{animation:hop .55s ease-in-out infinite}
.tok .ind{display:none}.tok.me .ind{display:block;animation:ind .8s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
@keyframes ind{50%{transform:translateY(-3px)}}
.dyn.pop{animation:popin .5s cubic-bezier(.3,1.8,.5,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{from{transform:scale(.15)}}
.avn{overflow:visible}
.o,.avn .o,.av .o{stroke:#5a3a2e;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.avn .o{stroke-width:4}
.av{width:100%;height:100%;display:block;overflow:visible}
.mini-av{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em}
.bigav{width:6em;height:6.6em;margin:0 auto}
.pv{display:inline-block;width:3.2em;height:3.7em}

/* ---- 左上：標題與回合 ---- */
#hudTop{left:calc(1.2*var(--u) + var(--sl));top:calc(1.2*var(--u));background:rgba(120,160,255,.38);border:calc(.35*var(--u)) solid rgba(255,255,255,.75);backdrop-filter:blur(4px);border-radius:calc(1.8*var(--u));padding:calc(.7*var(--u)) calc(1.8*var(--u));font-size:calc(2.5*var(--u));font-weight:900;color:#243a7a;display:flex;gap:calc(1.2*var(--u));align-items:center;text-shadow:0 calc(.2*var(--u)) 0 rgba(255,255,255,.6)}
#hudTop small{font-size:.8em;color:#3e57a8}
.mascot{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12%) rotate(-8deg)}}

/* ---- 左側：玩家列 ---- */
#plist{left:calc(1.2*var(--u) + var(--sl));top:calc(9*var(--u));display:flex;flex-direction:column;gap:calc(.8*var(--u))}
.chip{display:flex;align-items:center;gap:calc(.8*var(--u));background:rgba(255,255,255,.92);border:calc(.4*var(--u)) solid var(--pc);border-radius:999px;padding:calc(.3*var(--u)) calc(1.8*var(--u)) calc(.3*var(--u)) calc(.4*var(--u));font-size:calc(2*var(--u));line-height:1.15;box-shadow:0 calc(.4*var(--u)) 0 rgba(0,0,0,.14);transition:transform .2s}
.chip .ca{width:calc(5.4*var(--u));height:calc(5.4*var(--u));border-radius:50%;background:#fff;border:calc(.3*var(--u)) solid var(--pc);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chip .ca .mini-av{width:100%;height:100%}
.chip .ci{display:flex;flex-direction:column;min-width:0}
.chip .ci b{font-size:1em;white-space:nowrap}
.chip .ci span{font-weight:800;color:#c78a00}
.chip.act{background:#fff3b0;transform:scale(1.07) translateX(calc(.6*var(--u)));animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 calc(1.8*var(--u)) var(--pc)}}
.chip.out{opacity:.35;text-decoration:line-through}

/* ---- 右側：黃色按鈕面板 ---- */
#side{right:calc(1.2*var(--u) + var(--sr));top:calc(11*var(--u));display:flex;flex-direction:column;gap:calc(1.2*var(--u));padding:calc(1*var(--u));background:linear-gradient(#6fd0f7,#3bb2ea);border:calc(.45*var(--u)) solid #d9f3ff;border-radius:calc(2.2*var(--u));box-shadow:0 calc(.7*var(--u)) 0 #1f8fc7,0 calc(1.4*var(--u)) calc(2*var(--u)) rgba(0,0,0,.2)}
.sbtn{width:calc(8.6*var(--u));height:calc(8.6*var(--u));border-radius:calc(1.8*var(--u));border:calc(.45*var(--u)) solid #cdeeff;background:linear-gradient(#ffe980,#ffc21a 70%,#f5a800);font-size:calc(4.4*var(--u));display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 calc(.5*var(--u)) 0 rgba(255,255,255,.6),0 calc(.4*var(--u)) 0 #c98900;padding:0}
.sbtn:hover{filter:brightness(1.08)}.sbtn:active{transform:translateY(calc(.3*var(--u)))}

/* ---- 底部：數值列 ---- */
#bar{left:0;right:0;bottom:0;height:calc(8.8*var(--u) + var(--sb));padding-bottom:var(--sb);background:linear-gradient(#34bdf5,#0f97d8);border-top:calc(.45*var(--u)) solid #c6ecff;display:flex;align-items:center;justify-content:space-evenly;padding-top:0;padding-left:calc(22*var(--u));padding-right:calc(24*var(--u));color:#fff;box-shadow:0 calc(-.6*var(--u)) calc(1.6*var(--u)) rgba(0,0,0,.15)}
#bar .st{display:flex;align-items:center;gap:calc(1.2*var(--u));font-weight:900;font-size:calc(4.4*var(--u));text-shadow:0 calc(.3*var(--u)) 0 rgba(0,70,120,.45)}
#bar .st i{font-style:normal;font-size:.9em}
#bar .st small{font-size:.38em;opacity:.9;margin-left:calc(-.4*var(--u));align-self:flex-end;margin-bottom:calc(1.2*var(--u))}
#pwrap{position:fixed;left:0;bottom:0;width:calc(22*var(--u));height:calc(24*var(--u));z-index:7;pointer-events:none}
#portrait{position:absolute;left:calc(1*var(--u));bottom:calc(2.6*var(--u));width:calc(18*var(--u));height:calc(18*var(--u));border-radius:50%;background:radial-gradient(circle at 40% 30%,#fffbd0,#ffd54f);border:calc(.9*var(--u)) solid #fff;box-shadow:0 0 0 calc(.8*var(--u)) var(--pc,#4aa3df),0 calc(1*var(--u)) calc(2*var(--u)) rgba(0,0,0,.3);padding:calc(1.2*var(--u));overflow:hidden}
#portrait svg{width:100%;height:100%;display:block}
#pname{position:absolute;left:calc(1.2*var(--u));bottom:calc(.5*var(--u));font-size:calc(3.6*var(--u));font-weight:900;color:#fff;-webkit-text-stroke:calc(.55*var(--u)) #2a6fd6;paint-order:stroke fill;text-shadow:0 calc(.4*var(--u)) 0 rgba(0,40,120,.4);white-space:nowrap}

/* ---- 右下：骰子與 GO ---- */
#rollBtn{right:calc(1*var(--u) + var(--sr));bottom:calc(1*var(--u));width:calc(21*var(--u));height:calc(21*var(--u));border-radius:50%;border:calc(.9*var(--u)) solid #ffeaa8;background:radial-gradient(circle at 35% 28%,#ffe28a,#ffa726 62%,#f57c00);box-shadow:inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.45),0 calc(.9*var(--u)) 0 #c25e00,0 calc(1.6*var(--u)) calc(2.4*var(--u)) rgba(0,0,0,.3);cursor:pointer;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;padding:0;color:#fff}
#rollBtn .gd{font-size:calc(8.4*var(--u));line-height:1;filter:drop-shadow(0 calc(.5*var(--u)) 0 rgba(0,0,0,.2))}
#rollBtn .go{font-size:calc(7*var(--u));font-weight:900;line-height:.9;color:#fff6c2;-webkit-text-stroke:calc(.5*var(--u)) #c25e00;paint-order:stroke fill;letter-spacing:calc(.2*var(--u));text-shadow:0 calc(.5*var(--u)) 0 #c25e00}
#rollBtn:not(:disabled){animation:pulse 1s ease-in-out infinite}
#rollBtn:disabled{filter:grayscale(.75) brightness(1.05);opacity:.72;cursor:default}
@keyframes pulse{50%{box-shadow:inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.45),0 calc(.9*var(--u)) 0 #c25e00,0 0 calc(3.4*var(--u)) calc(1*var(--u)) rgba(255,214,79,.95)}}
#dice{right:calc(3.2*var(--u));bottom:calc(23.5*var(--u));display:flex;gap:calc(1.4*var(--u));visibility:hidden}
#dice.show{visibility:visible}
.die{width:calc(8.6*var(--u));height:calc(8.6*var(--u));background:#fff;border-radius:calc(1.8*var(--u));border:calc(.4*var(--u)) solid #e7e7e7;box-shadow:0 calc(.7*var(--u)) 0 #c9c9c9,0 calc(1.2*var(--u)) calc(1.6*var(--u)) rgba(0,0,0,.2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(1.1*var(--u))}
.pip{background:#e5484d;border-radius:50%;width:78%;height:78%;margin:auto;box-shadow:inset 0 calc(-.2*var(--u)) 0 rgba(0,0,0,.25)}
#dice.rolling .die{animation:wob .14s infinite}
#dice.rolling .die+.die{animation-direction:reverse}
@keyframes wob{0%{transform:rotate(-16deg) translateY(-6%)}50%{transform:rotate(16deg) translateY(4%)}100%{transform:rotate(-16deg) translateY(-6%)}}
#pills{right:calc(23.5*var(--u));bottom:calc(10.6*var(--u));display:none;gap:calc(1.2*var(--u))}
#pills.on{display:flex}

/* ---- 提示訊息 ---- */
#toast{left:calc(23*var(--u));bottom:calc(10.6*var(--u));display:flex;flex-direction:column;gap:calc(.6*var(--u));align-items:flex-start;pointer-events:none;max-width:48vw}
.tt{background:rgba(255,255,255,.9);border-radius:calc(1.4*var(--u));padding:calc(.5*var(--u)) calc(1.6*var(--u));font-size:calc(2.2*var(--u));font-weight:800;box-shadow:0 calc(.3*var(--u)) 0 rgba(0,0,0,.12);animation:tin .25s ease-out,tout .6s 5s forwards}
@keyframes tin{from{opacity:0;transform:translateY(calc(1*var(--u)))}}
@keyframes tout{to{opacity:0}}

/* ---- 按鈕 ---- */
.btn{font:inherit;font-size:calc(2.6*var(--u));font-weight:800;padding:.5em 1.3em;border-radius:999px;border:calc(.4*var(--u)) solid #fff;background:#8fd3ff;color:#2d3a5a;cursor:pointer;box-shadow:0 calc(.6*var(--u)) 0 #5aa9de;transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translateY(calc(-.25*var(--u)))}
.btn:active:not(:disabled){transform:translateY(calc(.4*var(--u)));box-shadow:0 calc(.15*var(--u)) 0 #5aa9de}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.4)}
.btn.ok{background:#ffd54f;box-shadow:0 calc(.6*var(--u)) 0 #e0a800}
.btn.ok:active:not(:disabled){box-shadow:0 calc(.15*var(--u)) 0 #e0a800}
.btn.gray{background:#e9e2f2;box-shadow:0 calc(.6*var(--u)) 0 #b9b0c9}
.btn.pick{outline:calc(.6*var(--u)) solid #ff5c8a;outline-offset:calc(.2*var(--u))}

/* ---- 彈窗 ---- */
.ov{position:fixed;inset:0;background:rgba(120,60,130,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20}
.ov.on{display:flex}
.box{background:#fffaf0;border:.7vh solid #fff;border-radius:3.5vh;padding:3vh;width:min(92vw,85vh);max-height:92vh;max-height:92dvh;overflow:auto;font-size:clamp(16px,2.5vh,36px);text-align:center;
 box-shadow:0 calc(1*var(--u)) 0 rgba(150,90,160,.35),0 calc(2*var(--u)) calc(4*var(--u)) rgba(0,0,0,.25);outline:calc(.4*var(--u)) dashed #ffb0c8;outline-offset:calc(-1.4*var(--u));animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.box h1,.box h2,.box h3{margin:.2em 0;color:#ff6f9c}
.box p{margin:.4em 0}
.box .big{font-size:3.4em;animation:bob 1.4s ease-in-out infinite}
.box .qc{display:inline-block;background:#ffd54f;border-radius:999px;padding:.1em .9em;font-size:.8em;font-weight:800;color:#6b4b00}
.box .ai{color:#9a8aa8;font-size:.8em}
#mbtn{display:flex;flex-direction:column;gap:.55em;margin-top:.9em;align-items:stretch}
#mbtn .btn{font-size:inherit}
#mbtn .btn:nth-child(4n+1){background:#ffc9d9;box-shadow:0 calc(.6*var(--u)) 0 #f09ab4}
#mbtn .btn:nth-child(4n+2){background:#c8ecff;box-shadow:0 calc(.6*var(--u)) 0 #8cc9ea}
#mbtn .btn:nth-child(4n+3){background:#d3f5cf;box-shadow:0 calc(.6*var(--u)) 0 #9fd698}
#mbtn .btn:nth-child(4n+4){background:#ffe7b3;box-shadow:0 calc(.6*var(--u)) 0 #efc46a}
#mbtn .btn.ok{background:#ffd54f;box-shadow:0 calc(.6*var(--u)) 0 #e0a800}
#mbtn .btn.gray{background:#e9e2f2;box-shadow:0 calc(.6*var(--u)) 0 #b9b0c9}
.setup{text-align:left}
.box.setup{font-size:clamp(14px,calc(2*var(--u)),28px);padding:calc(2.2*var(--u)) calc(3*var(--u))}
.setup h1{text-align:center;font-size:1.5em}
.setup .row{display:flex;gap:.5em;align-items:center;margin:.35em 0;flex-wrap:nowrap}
.setup .row.cnt,.setup .row.opt{flex-wrap:wrap}
.setup input[type=text],.setup select{font:inherit;padding:.2em .5em;border:3px solid #ffb0c8;border-radius:999px;background:#fff;color:var(--ink)}
.setup input[type=text]{width:6.5em}
.setup .cnt button{font:inherit;font-weight:800;width:2em;height:2em;border-radius:50%;border:3px solid #ffb0c8;background:#fff;cursor:pointer;color:var(--ink)}
.setup .cnt button.on{background:#ffd54f;border-color:#fff;box-shadow:0 .15em 0 #e0a800}
.setup .sk{flex:1;min-width:0;line-height:1.2;font-size:.75em;color:#8a6a9a}
.setup .pv{flex:none;width:2.8em;height:3.2em}
.rules li{margin:.3em 0}
.rules{text-align:left}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:.5em 0}
.dc{background:#fff;border-radius:1.2em;padding:.4em;border:3px solid #ffd0e0}
.dca{height:6.5em}
.dc .sk{font-size:.62em;color:#8a6a9a;min-height:2.4em}
.dm{display:flex;justify-content:center;gap:.3em}
.dm span{display:inline-block;width:2.3em;height:2.2em}
.cf{position:fixed;top:-8vh;z-index:30;font-size:3.5vh;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* ---- 直式（手機／平板直立）：--u = 1vw，另做一套配置 ---- */
@supports(height:1dvh){@media (orientation:portrait){#map{height:calc(100dvh - 90*var(--u) - var(--st) - var(--sb))}}}
@media (orientation:portrait){
 #map{inset:auto;left:0;right:0;top:calc(38*var(--u) + var(--st));width:100%;height:calc(100vh - 90*var(--u) - var(--st) - var(--sb))}
 #hudTop{left:calc(2*var(--u) + var(--sl));top:calc(2*var(--u) + var(--st));font-size:calc(4.2*var(--u));padding:calc(1.4*var(--u)) calc(3*var(--u));gap:calc(1.6*var(--u));border-width:calc(.5*var(--u));border-radius:calc(3*var(--u));height:calc(12*var(--u))}
 #hudTop>span:nth-child(2){display:none}
 #hudTop small{font-size:calc(3.8*var(--u))}
 #side{top:calc(2*var(--u) + var(--st));right:calc(2*var(--u) + var(--sr));flex-direction:row;gap:calc(1.2*var(--u));padding:calc(1.2*var(--u));border-radius:calc(3*var(--u));border-width:calc(.6*var(--u))}
 .sbtn{width:calc(9.6*var(--u));height:calc(9.6*var(--u));font-size:calc(5.2*var(--u));border-radius:calc(2.4*var(--u));border-width:calc(.5*var(--u))}
 #plist{left:calc(2*var(--u) + var(--sl));right:calc(2*var(--u) + var(--sr));top:calc(17*var(--u) + var(--st));display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1.4*var(--u))}
 .chip{font-size:calc(3.5*var(--u));padding:calc(.4*var(--u)) calc(2*var(--u)) calc(.4*var(--u)) calc(.5*var(--u));gap:calc(1.2*var(--u));border-width:calc(.5*var(--u));min-width:0}
 .chip .ca{width:calc(8*var(--u));height:calc(8*var(--u));border-width:calc(.4*var(--u))}
 .chip.act{transform:scale(1.04)}
 #bar{height:calc(13*var(--u) + var(--sb));padding-left:0;padding-right:0}
 #bar .st{font-size:calc(6*var(--u));gap:calc(1.4*var(--u))}
 #bar .st small{margin-bottom:calc(1.8*var(--u))}
 #pwrap{width:calc(32*var(--u));height:calc(34*var(--u));bottom:calc(13*var(--u) + var(--sb));left:var(--sl)}
 #portrait{left:calc(2.5*var(--u));bottom:calc(2*var(--u));width:calc(24*var(--u));height:calc(24*var(--u));border-width:calc(1.2*var(--u));padding:calc(1.5*var(--u));box-shadow:0 0 0 calc(1*var(--u)) var(--pc,#4aa3df),0 calc(1*var(--u)) calc(2*var(--u)) rgba(0,0,0,.3)}
 #pname{left:calc(2.5*var(--u));bottom:0;font-size:calc(5.4*var(--u));-webkit-text-stroke:calc(.8*var(--u)) #2a6fd6}
 #rollBtn{width:calc(30*var(--u));height:calc(30*var(--u));right:calc(2.5*var(--u) + var(--sr));bottom:calc(15*var(--u) + var(--sb));border-width:calc(1.2*var(--u))}
 #rollBtn .gd{font-size:calc(11*var(--u))}
 #rollBtn .go{font-size:calc(9*var(--u));-webkit-text-stroke:calc(.7*var(--u)) #c25e00}
 #dice{right:auto;left:50%;transform:translateX(-50%);bottom:calc(35*var(--u) + var(--sb));gap:calc(2*var(--u))}
 .die{width:calc(11*var(--u));height:calc(11*var(--u));border-radius:calc(2.4*var(--u));padding:calc(1.4*var(--u))}
 #pills{right:auto;left:calc(34*var(--u));bottom:calc(15*var(--u) + var(--sb));flex-direction:column;gap:calc(1.6*var(--u));width:calc(33*var(--u))}
 #pills .btn{width:100%;font-size:calc(4*var(--u));padding:.45em .5em;border-width:calc(.5*var(--u));white-space:nowrap}
 #toast{left:calc(2*var(--u) + var(--sl));right:calc(2*var(--u) + var(--sr));bottom:calc(49*var(--u) + var(--sb));max-width:none;align-items:center}
 #toast .tt:nth-last-child(n+3){display:none}
 .tt{font-size:calc(3.8*var(--u));padding:calc(.8*var(--u)) calc(2.4*var(--u));border-radius:calc(2.4*var(--u))}
 .btn{font-size:calc(4.4*var(--u))}
 .box{width:92vw;max-height:90vh;max-height:90dvh;font-size:clamp(16px,4.4vw,34px);padding:5vw;border-radius:6vw}
 .box.setup{font-size:clamp(13px,3.5vw,26px);padding:4vw}
 .setup input[type=text]{width:5em}
}
@media (max-width:600px){.setup .row .sk{display:none}.setup .row{gap:.4em}}
/* ---- 手機橫式（高度很矮） ---- */
@media (orientation:landscape) and (max-height:520px){
 #hudTop>span:nth-child(2){display:none}
 #hudTop{font-size:calc(3.4*var(--u))}
 .box{max-height:94vh;max-height:94dvh;padding:calc(2*var(--u)) calc(3*var(--u))}

function tileStatic(t,i){
  if(t.t==='prop')return `<polygon points="${dia(0,0,.9)}" fill="${GC[t.g]}"/><polygon id="gr${i}" points="${dia(0,0,.72)}" fill="#86d24a" stroke="none" stroke-width="2.6" stroke-linejoin="round"/><polygon points="${dia(0,0,.72)}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"/>`;
  if(t.t==='chance'||t.t==='story'||t.t==='quiz'){const dk={chance:'#b9600f',story:'#5a2bb0',quiz:'#175aa8'}[t.t];
    return `<ellipse cx="0" cy="4.5" rx="25" ry="12.5" fill="${dk}"/><ellipse cx="0" cy="0" rx="25" ry="12.5" fill="url(#g_${t.t})" stroke="#fff" stroke-width="2.4"/><ellipse cx="-9" cy="-5.5" rx="9" ry="2.8" fill="#fff" opacity=".5"/>`
     +`<text y="-0.5" font-size="15.5" text-anchor="middle" style="filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))">${t.e}</text><text y="9" font-size="7.6" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="1.7" paint-order="stroke" text-anchor="middle">${t.n}</text>`;}
  return `<polygon points="${dia(0,0,.99)}" fill="url(#g_corner)" stroke="#ff8fab" stroke-width="2.2" stroke-linejoin="round"/><polygon points="${dia(0,0,.8)}" fill="rgba(255,255,255,.45)"/><text y="-1" font-size="27" text-anchor="middle" style="filter:drop-shadow(0 2px 0 rgba(0,0,0,.22))">${t.e}</text>`;}
function tileLabel(t,i){
  if(t.t==='prop')return pill(t.n,14.5,8.2,GC[t.g]);
  if(t.t==='chance'||t.t==='story'||t.t==='quiz')return '';
  return pill(t.n,15.5,8.2,'#ff8fab')+(t.s?`<text y="26.5" font-size="6" font-weight="800" text-anchor="middle" fill="#7a3b55" stroke="#fff" stroke-width="2" paint-order="stroke">${t.s}</text>`:'');}

function buildBoard(){
  const svg=$('map');
  let defs='<defs>'+[['chance','#fff0b0','#ffb347','#e8801a'],['story','#eedcff','#b57bff','#7b3fe0'],['quiz','#d2eeff','#4db3ff','#1f7ae0']].map(([k,a,b,c])=>`<radialGradient id="g_${k}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`).join('')
   +`<linearGradient id="g_lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2ee57"/><stop offset="1" stop-color="#97d83f"/></linearGradient><linearGradient id="g_corner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffeaa8"/><stop offset="1" stop-color="#ffb7cb"/></linearGradient></defs>`;
  const P4=(c0,r0,c1,r1,dy)=>[isoXY(c0,r0),isoXY(c1,r0),isoXY(c1,r1),isoXY(c0,r1)].map(([x,y])=>`${x},${y+(dy||0)}`).join(' ');
  let ground=`<polygon points="${P4(-.55,-.55,7.55,7.55,7)}" fill="#6aa82a"/><polygon points="${P4(.5,.5,6.5,6.5,5)}" fill="#6aa82a"/><polygon points="${P4(.5,.5,6.5,6.5)}" fill="url(#g_lawn)" stroke="#7fc22f" stroke-width="2" stroke-linejoin="round"/>`;
  for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if((a+b)%2){const[x,y]=isoXY(a,b);ground+=`<polygon points="${dia(x,y,1)}" fill="rgba(255,255,255,.1)"/>`;}
  let s=7;for(let k=0;k<46;k++){s=(s*9301+49297)%233280;const a=.7+s/233280*5.6;s=(s*9301+49297)%233280;const b=.7+s/233280*5.6;const[x,y]=isoXY(a,b);const col=['#fff','#ffe066','#ff9ec0','#ffffff'][k%4];ground+=`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" opacity=".85"><circle cx="-2" cy="0" r="1.2" fill="${col}"/><circle cx="2" cy="1" r="1.2" fill="${col}"/><circle cx="0" cy="-1.6" r="1" fill="${col}"/></g>`;}
  let road='';
  T.forEach((t,i)=>{const[x,y]=cell(i);road+=`<polygon points="${dia(x,y+3.5,1.02)}" fill="#7d868c"/>`;});
  T.forEach((t,i)=>{const[x,y]=cell(i);road+=`<polygon points="${dia(x,y,1.02)}" fill="#a9b1b6" stroke="#8c959b" stroke-width="1.4" stroke-linejoin="round"/><polygon points="${dia(x,y,.93)}" fill="#b8bfc4"/>`;});
  const items=[];
  SCENE.forEach(o=>{const[x,y]=isoXY(o.c,o.r);items.push({d:o.c+o.r+.01,s:`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${o.f()}</g>`});});
  T.forEach((t,i)=>{const[x,y]=cell(i),[c,r]=cr(i);items.push({d:c+r,s:`<g id="t${i}" transform="translate(${x},${y})"><title>${t.n}${t.t==='prop'?'（'+GN[t.g]+'）💰'+t.p:''}</title>${tileStatic(t,i)}<g class="dyn"></g></g>`});});
  let labels='';T.forEach((t,i)=>{const[x,y]=cell(i),l=tileLabel(t,i);if(l)labels+=`<g transform="translate(${x},${y})" pointer-events="none">${l}</g>`;});
  items.sort((a,b)=>a.d-b.d);
  svg.innerHTML=defs+`<g>${ground}</g><g>${road}</g><g>${items.map(o=>o.s).join('')}</g><g>${labels}</g><g id="tokLayer"></g>`;
}
function landValue(p){let s=0;T.forEach((t,i)=>{if(S.own[i]===p.id)s+=t.p*(1+S.lvl[i]*.5)});return Math.round(s);}

function renderTiles(){
  T.forEach((t,i)=>{
    if(t.t!=='prop')return;
    const g=document.querySelector('#t'+i+' .dyn');if(!g)return;
    const o=S?S.own[i]:-1,lv=S?S.lvl[i]:0,key=o+'/'+lv;
    if(g.dataset.k===key)return;
    const first=g.dataset.k===undefined;g.dataset.k=key;
    const col=o>=0?PCOL[o]:null;
    g.innerHTML=o<0?saleSign(t.p):bldg(lv,col,S.players[o]);
    $('gr'+i).setAttribute('stroke',col||'none');
    if(!first){g.classList.remove('pop');void g.getBoundingClientRect();g.classList.add('pop');}
  });
}
const TOFF=[[0,3],[-13,0],[13,0],[-7,-6],[7,-6],[0,-9]];
function renderTokens(){
  if(!S)return;
  const L=$('tokLayer'),by={};
  S.players.forEach(p=>{if(!p.out)(by[p.pos]=by[p.pos]||[]).push(p);});
  S.players.forEach(p=>{
    let g=$('tk'+p.id);
    if(!g){g=document.createElementNS(NS,'g');g.id='tk'+p.id;g.setAttribute('class','tok');
      g.innerHTML=`<ellipse cx="0" cy="0" rx="13" ry="5" fill="${PCOL[p.id]}" opacity=".6"/><ellipse cx="0" cy="0.5" rx="10" ry="3.6" fill="rgba(0,0,0,.22)"/><g class="hopper">${av(p.ch.k,'normal','full').replace('<svg class="av"','<svg class="avn" x="-15" y="-36" width="30" height="35"')}</g><path class="ind" d="M-5 -45 h10 l-5 8z" fill="${PCOL[p.id]}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
      const[x0,y0]=cell(p.pos);g.style.transform=`translate(${x0}px,${y0}px)`;L.appendChild(g);}
    if(p.out){g.style.display='none';return;}
    const arr=by[p.pos],idx=arr.indexOf(p),[cx,cy]=cell(p.pos),off=arr.length===1?[0,2]:TOFF[idx%6];
    g.style.transform=`translate(${cx+off[0]}px,${cy+off[1]}px)`;
    g.classList.toggle('me',p.id===S.cur);
  });
}

function showModal(html,btns,auto){
  return new Promise(res=>{
    $('mb').innerHTML=html;const bx=$('mbtn');bx.innerHTML='';
    (btns||[]).forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.c?' '+b.c:'');el.textContent=b.l;
      if(auto){el.disabled=true;if(b.v===auto.v)el.classList.add('pick');}
      else el.onclick=()=>{$('ov').classList.remove('on');res(b.v);};
      bx.appendChild(el);});
    $('ov').classList.add('on');
    if(auto)setTimeout(()=>{$('ov').classList.remove('on');res(auto.v);},auto.ms||1800);
  });
}

function pay(a,b,n){a.money-=n;b.money+=n;log(`${a.ch.e}${a.name} 付 💰${n} 給 ${b.ch.e}${b.name}`);renderPlayers();}

const hasSet=(pid,g)=>T.every((t,i)=>t.g!==g||t.t!=='prop'||S.own[i]===pid);

  if(deck==='ch'&&p.ch.n==='小晴'){
    const c2=draw(deck);
    const v=await ask(p,`<h2>${title}</h2><p>🌞 小晴技能：兩張選一張</p>`,[{l:`${c.i} ${c.t}：${c.d}`,v:0},{l:`${c2.i} ${c2.t}：${c2.d}`,v:1}],()=>Math.random()<.5?0:1);
    if(v===1)c=c2;
  } else await say(p,`<h2>${title}</h2><div class="big">${c.i}</div><h3>${c.t}</h3><p>${c.d}</p>`);
  log(`${p.ch.e}${p.name} 抽到「${c.t}」`);
  await c.f(p);
}
async function freeUp(p){
  const c=T.map((t,i)=>i).filter(i=>S.own[i]===p.id&&S.lvl[i]<2);
  if(!c.length){gain(p,50,'沒有土地可升級，改領獎金');return;}
  const best=c.slice().sort((a,b)=>T[b].p-T[a].p)[0];
  const v=await ask(p,'<h2>🎁 免費升級</h2><p>選一塊土地升級</p>',c.map(i=>({l:`${T[i].e}${T[i].n} → ${LN[S.lvl[i]+1]}`,v:i})),()=>best);
  S.lvl[v]++;log(`${p.ch.e}${p.name} 免費把「${T[v].n}」升級成${LN[S.lvl[v]]}`);renderTiles();renderPlayers();
}

/* ===== 問答 ===== */
async function quiz(p,base){
  let pool=QB.map((q,i)=>i).filter(i=>S.diff==='mix'||(S.diff==='easy'?QB[i].lv===1:QB[i].lv===2));
  let avail=pool.filter(i=>!S.usedQ.has(i));if(!avail.length){pool.forEach(i=>S.usedQ.delete(i));avail=pool;}
  const qi=avail[Math.floor(Math.random()*avail.length)];S.usedQ.add(qi);
  const q=QB[qi];const opts=shuffle(q.o.map((x,k)=>({l:x,v:k})));
  const pick=await ask(p,`<div class="qc">${q.c}</div><h2>${q.q}</h2>`,opts,()=>Math.random()<.6?0:1+Math.floor(Math.random()*(q.o.length-1)));
  if(pick===0){
    const r=base*(p.ch.n==='阿哲'?2:1);p.correct++;gain(p,r,'答對');
    await say(p,`<div class="bigav">${av(p.ch.k,'happy')}</div><h2>✅ 答對了！+💰${r}</h2>${p.ch.n==='阿哲'?'<p>🧠 阿哲技能：獎金加倍</p>':''}<p>${q.e}</p>`);
  } else {
    log(`${p.ch.e}${p.name} 答錯了`);
    await say(p,`<div class="bigav">${av(p.ch.k,'sad')}</div><h2>❌ 差一點！</h2><p>正確答案：<b>${q.o[0]}</b></p><p>${q.e}</p>`);
  }
}

/* ===== 落地結算 ===== */
async function landProp(p){
  const i=p.pos,t=T[i],o=S.own[i];
  if(o===-1){
    if(p.money<t.p){await say(p,`<h2>${t.e} ${t.n}</h2><p>認養價 💰${t.p}，錢不夠，下次再來！</p>`);return;}
    const yes=await ask(p,`<h2>${t.e} ${t.n}</h2><p>${GN[t.g]}｜認養價 💰${t.p}</p><p>基本過路費 💰${rent(i)}，升級大戲台最高 💰${t.p}</p>`,[{l:`認養（💰${t.p}）`,v:true,c:'ok'},{l:'先不要',v:false}],()=>p.money-t.p>=150||wouldSet(p,t.g));
    if(yes){p.money-=t.p;S.own[i]=p.id;log(`${p.ch.e}${p.name} 認養了「${t.n}」（−💰${t.p}）`);renderTiles();renderPlayers();}
  } else if(o!==p.id){
    const owner=S.players[o];let r=rent(i),note='';
    if(p.ch.n==='小綠'&&t.g===1){r=0;note='🐸 小綠技能：免付過路費';}
    else if(p.ch.n==='米米'){r=Math.round(r*.8);note='🐱 米米技能：打八折';}
    await say(p,`<h2>${t.e} ${t.n}</h2><p>這是 ${owner.ch.e}${owner.name} 的地盤（${LN[S.lvl[i]]}）</p><p>過路費 💰${r}</p><p>${note}</p>`);
    if(r>0)pay(p,owner,r);else log(`${p.ch.e}${p.name} 免付過路費`);
  } else {
    if(S.lvl[i]<2&&hasSet(p.id,t.g)){
      const c=upCost(i);
      if(p.money>=c){
        const y=await ask(p,`<h2>${t.e} ${t.n}</h2><p>你集齊了「${GN[t.g]}」！</p><p>升級成${LN[S.lvl[i]+1]}？（💰${c}）</p>`,[{l:`升級（💰${c}）`,v:true,c:'ok'},{l:'先不要',v:false}],()=>p.money-c>=250);
        if(y)doUp(p,i);
      }
    } else log(`${p.ch.e}${p.name} 回到自己的地盤`);
  }
}
async function land(p){
  const t=T[p.pos];renderTokens();
  switch(t.t){
    case 'prop':await landProp(p);break;
    case 'chance':await drawCard(p,'ch');break;
    case 'free':await say(p,'<h2>🎪 戲台廣場</h2><p>免費抽一張機會卡！</p>');await drawCard(p,'ch');break;
    case 'story':await drawCard(p,'st');break;
    case 'quiz':await say(p,'<h2>❓ 同樂問答</h2><p>答對可得 💰100</p>');await quiz(p,100);break;
    case 'jail':p.skip=1;await say(p,'<h2>🏥 保健室</h2><p>休息一回合</p>');break;
    case 'goj':p.pos=7;p.skip=1;renderTokens();await say(p,'<h2>🔔 午休鐘響</h2><p>到保健室休息一回合</p>');break;
  }
  await settle();
}
async function settle(){for(const q of S.players){if(!q.out&&q.money<0)await bankrupt(q);}}
async function bankrupt(q){
  q.out=true;T.forEach((t,i)=>{if(S.own[i]===q.id){S.own[i]=-1;S.lvl[i]=0;}});
  log(`💥 ${q.ch.e}${q.name} 錢不夠了，離開遊戲`);renderAll();
  await flash(`<h2>💥 ${q.ch.e} ${q.name} 的錢不夠了</h2><p>名下土地回到學校</p>`,2000);
}

/* ===== 回合流程 ===== */
function waitRoll(){return new Promise(r=>{rollWait=r;setActs('roll');});}
function waitEnd(){return new Promise(r=>{endWait=r;setActs('end');});}
$('rollBtn').onclick=()=>{if(rollWait){const r=rollWait;rollWait=null;setActs('none');r();}};
$('endBtn').onclick=()=>{if(endWait){const r=endWait;endWait=null;setActs('none');r();}};
$('upgBtn').onclick=async()=>{
  const p=S.players[S.cur];setActs('none');
  while(true){
    const cand=T.map((t,i)=>i).filter(i=>S.own[i]===p.id&&T[i].t==='prop'&&S.lvl[i]<2&&hasSet(p.id,T[i].g)&&p.money>=upCost(i));
    if(!cand.length){await showModal('<h2>🎪 升級戲台</h2><p>目前沒有可升級的土地。</p><p>需要集齊同色土地，而且錢要夠。</p>',[{l:'好',v:1}]);break;}
    const btns=cand.map(i=>({l:`${T[i].e}${T[i].n} → ${LN[S.lvl[i]+1]}（💰${upCost(i)}）`,v:i}));btns.push({l:'完成',v:-1,c:'gray'});
    const v=await showModal('<h2>🎪 升級戲台</h2><p>集齊同色土地才能升級</p>',btns);
    if(v===-1)break;doUp(p,v);
  }
  setActs('end');
};
async function aiUpgrades(p){
  for(let n=0;n<3;n++){
    const c=T.map((t,i)=>i).filter(i=>S.own[i]===p.id&&T[i].t==='prop'&&S.lvl[i]<2&&hasSet(p.id,T[i].g)&&p.money-upCost(i)>=250).sort((a,b)=>T[b].p-T[a].p);
    if(!c.length)break;doUp(p,c[0]);await sleep(500);
  }
}
async function rollAnim(d1,d2){$('dice').classList.add('rolling','show');for(let k=0;k<9;k++){setDie('d1',r6());setDie('d2',r6());await sleep(70);}setDie('d1',d1);setDie('d2',d2);$('dice').classList.remove('rolling');}
async function playTurn(){
  if(S.over)return;
  const p=S.players[S.cur];renderAll();setActs('none');
  if(p.skip>0){p.skip--;log(`${p.ch.e}${p.name} 在保健室休息，跳過這回合`);await flash(`<h2>${p.ch.e} ${p.name}</h2><p>在保健室休息，這回合跳過</p>`,1400);return nextTurn();}
  let again;
  do{
    again=false;
    if(p.ai)await sleep(700);else await waitRoll();
    const d1=r6(),d2=r6();await rollAnim(d1,d2);
    log(`${p.ch.e}${p.name} 擲出 ${d1}＋${d2}＝${d1+d2}`);
    await advance(p,d1+d2);
    if(S.over||p.out)break;
    if(d1===d2&&p.ch.n==='鼓鼓'&&p.skip===0){again=true;await flash('🥁 鼓鼓技能：擲出相同點數，再擲一次！',1300);}
  }while(again);
  if(!p.out){if(p.ai){await aiUpgrades(p);await sleep(500);}else await waitEnd();}
  nextTurn();
}
function nextTurn(){
  if(S.over)return;
  if(alive().length<=1)return endGame();
  let n=S.cur,wrapped=false;
  do{n=(n+1)%S.players.length;if(n<=S.cur)wrapped=true;}while(S.players[n].out);
  S.cur=n;
  if(wrapped){S.round++;if(S.mode==='rounds'&&S.round>S.maxR)return endGame();}
  setTimeout(playTurn,300);
}
function endGame(){
  S.over=true;setActs('none');confetti();
  const rank=S.players.slice().sort((a,b)=>(a.out-b.out)||(score(b)-score(a)));
  const medals=['🥇','🥈','🥉'];
  $('mb').innerHTML=`<h1>🎉 遊戲結束</h1><h2>${rank[0].ch.e} ${rank[0].name} 是校園嘉年華的冠軍！</h2>`+
    rank.map((p,i)=>`<p>${medals[i]||'　'} ${p.ch.e} ${p.name}　人氣 ${score(p)}（💰${p.money}・答對 ${p.correct} 題）${p.out?'（已離場）':''}</p>`).join('');
  $('mbtn').innerHTML='';const b=document.createElement('button');b.className='btn ok';b.textContent='再玩一次';b.onclick=()=>location.reload();$('mbtn').appendChild(b);
  $('ov').classList.add('on');
}

$('ruleBtn').onclick=()=>showModal(`<h2>📖 遊戲規則</h2><ol class="rules">
<li>輪流擲骰前進，每人起始 💰1500，經過校門口領 💰200。</li>
<li>停在空地可認養；停在別人的地盤要付過路費。</li>
<li><b>集齊同色四塊土地</b>，就能把落地掃空地升級成小戲台、大戲台，過路費大幅提高。</li>
<li>❓ 同樂問答：答對得獎金，也會增加人氣值（每答對一題 +40）。</li>
<li>🎊 機會（節慶與校慶活動）、🎴 命運（校園小故事）：抽卡，有獎也有小小意外。</li>
<li>🏥 保健室、🔔 午休鐘響：休息一回合。</li>
<li>限時賽：時間到比「人氣值」（現金＋土地價值＋答對加分）。經典賽：撐到最後。</li>
<li>每位小將都有自己的技能，選角色時可以看到。</li></ol>`,[{l:'知道了',v:1,c:'ok'}]);

function confetti(){const em=['🎉','🎊','⭐','🎈','🌸','🎭','🏮'];for(let i=0;i<44;i++){const s=document.createElement('span');s.className='cf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2.5+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*1.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),8000);}}
$('dexBtn').onclick=()=>showModal(`<h2>📒 同樂小將圖鑑（第一版）</h2><div class="dex">${CHARS.map(c=>`<div class="dc"><div class="dca">${av(c.k,'normal','full')}</div><b>${c.n}</b><div class="sk">${c.s}</div><div class="dm"><span>${av(c.k,'happy','head')}</span><span>${av(c.k,'sad','head')}</span></div></div>`).join('')}</div>`,[{l:'關閉',v:1,c:'ok'}]);
$('btnPlayers').onclick=()=>{if(!S)return;showModal('<h2>👥 玩家資訊</h2>'+S.players.map(p=>{const lands=T.map((t,i)=>S.own[i]===p.id?t.n+['','🎪','🎭'][S.lvl[i]]:'').filter(Boolean);return `<p style="text-align:left;border-bottom:3px dashed #ffd0e0;padding-bottom:.3em">${p.ch.e} <b>${p.name}</b>${p.ai?' 🤖':''}　💰${p.money}　⭐${score(p)}　答對 ${p.correct} 題${p.out?'（已離場）':''}<br><small style="color:#8a6a9a">${lands.join('、')||'還沒有土地'}</small></p>`;}).join(''),[{l:'關閉',v:1,c:'ok'}]);};
$('btnLog').onclick=()=>{if(!S)return;showModal('<h2>📜 遊戲紀錄</h2><div style="text-align:left;font-size:.8em;line-height:1.6">'+(S.logs.slice(0,40).join('<br>')||'還沒有紀錄')+'</div>',[{l:'關閉',v:1,c:'ok'}]);};
$('btnRestart').onclick=async()=>{const v=await showModal('<h2>🔄 重新開始？</h2><p>目前的遊戲進度會消失喔。</p>',[{l:'重新開始',v:true,c:'ok'},{l:'繼續遊戲',v:false}]);if(v)location.reload();};
(function(){const m=document.getElementById('map');const mq=matchMedia('(orientation:portrait)');const fit=()=>m.setAttribute('viewBox',mq.matches?'-318 -85 636 420':'-335 -85 700 420');fit();mq.addEventListener?mq.addEventListener('change',fit):mq.addListener(fit);})();
setDie('d1',0);setDie('d2',0);
buildBoard();renderTiles();
buildSetup();
</script>
